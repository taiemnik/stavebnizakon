<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Čistopis zákonů po 272 — stavební zákon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --navy:#193A5F;--blue:#3EA3DC;--sky:#D4EDFC;--green:#4DB05B;--red:#D94F4F;--amber:#E6A823;
      --bg:#f5f8fb;--card:#fff;--text:#1a2533;--muted:#5a6b80;--border:#cdd8e3;
      --ff:'Source Sans 3',system-ui,sans-serif;--r:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%}
    body{font-family:var(--ff);color:var(--text);background:var(--bg);line-height:1.6;height:100%;display:flex;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:100;background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.15)}
    .topbar h1{font-size:18px;font-weight:700;flex:1;min-width:180px}
    .topbar a{color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:600}
    .topbar a:hover{color:#fff}
    .layout{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
    @media(max-width:860px){.layout{grid-template-columns:1fr}}
    .sidebar{background:var(--card);border-right:1px solid var(--border);overflow:auto;padding:16px 0}
    .sidebar h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 18px}
    .sidebar input{width:calc(100% - 36px);margin:0 18px 12px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit}
    .law-btn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 18px;cursor:pointer;font:inherit;color:var(--text);border-left:3px solid transparent}
    .law-btn:hover{background:rgba(212,237,252,.4)}
    .law-btn.active{background:var(--sky);border-left-color:var(--blue);font-weight:600}
    .law-btn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
    .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
    .badge.full{background:var(--green);color:#fff}
    .badge.partial{background:var(--amber);color:#1a2533}
    .main{overflow:auto;padding:32px 28px 80px}
    .article{max-width:820px;margin:0 auto;font-family:'Source Serif 4',Georgia,serif;font-size:18px}
    .article h1{font-family:var(--ff);font-size:clamp(26px,4vw,36px);font-weight:900;color:var(--navy);line-height:1.2;margin-bottom:12px}
    .article h2,.article h3,.article h4,.article h5{font-family:var(--ff);color:var(--navy);margin:28px 0 10px}
    .article h4{font-size:20px;font-weight:700;border-bottom:2px solid var(--sky);padding-bottom:4px}
    .article p{margin:0 0 10px}
    .article blockquote{border-left:4px solid var(--blue);background:rgba(212,237,252,.35);padding:12px 16px;margin:16px 0;color:var(--muted);font-family:var(--ff);font-size:15px}
    .article hr{border:0;border-top:1px solid var(--border);margin:24px 0}
    .article del,.article s{background:#fde8e8;color:#7a1f1f;text-decoration:line-through;padding:0 2px}
    .article strong{background:#e7f6ea;color:#1a4a22;font-weight:700;padding:0 2px}
    .article code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--sky);padding:1px 6px;border-radius:4px}
    .empty{color:var(--muted);padding:48px 24px;text-align:center}
    .status{font-family:var(--ff);font-size:13px;color:var(--muted);margin-bottom:16px}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Čistopis zákonů po tisku 272</h1>
    <a href="index.html">Podcast EP6</a>
    <a href="https://github.com/taiemnik/stavebnizakon">GitHub</a>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <h2>Zákony</h2>
      <input id="q" type="search" placeholder="Filtrovat…" autocomplete="off">
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <div id="meta" class="status"></div>
      <article id="view" class="article">
        <p class="empty">Vyber zákon vlevo. 283/2021 je plný čistopis #4; ostatní zatím jen paragrafy, které 272 mění.</p>
      </article>
    </main>
  </div>
  <script>
    const BASE = "cistopis/";
    let laws = [];

    marked.setOptions({ gfm: true, breaks: false });

    function badge(mode){
      if(mode === "full") return '<span class="badge full">plný</span>';
      return '<span class="badge partial">jen změny</span>';
    }

    function renderNav(filter){
      const nav = document.getElementById("nav");
      const f = (filter || "").toLowerCase();
      nav.innerHTML = "";
      laws.filter(l => {
        const hay = (l.zakon + " " + l.title + " " + (l.clanky||[]).join(" ")).toLowerCase();
        return !f || hay.includes(f);
      }).forEach(l => {
        const b = document.createElement("button");
        b.className = "law-btn" + (location.hash.slice(1) === l.id ? " active" : "");
        b.innerHTML = (l.zakon || l.id) + " " + badge(l.mode) +
          "<small>" + (l.title || "").replace(/^Zákon[^,]*,?\s*/,"") + "</small>";
        b.onclick = () => { location.hash = l.id; };
        nav.appendChild(b);
      });
    }

    async function openLaw(id){
      const meta = laws.find(l => l.id === id);
      const view = document.getElementById("view");
      const status = document.getElementById("meta");
      document.querySelectorAll(".law-btn").forEach(el => {
        el.classList.toggle("active", el.textContent.startsWith((meta && meta.zakon) || id));
      });
      if(!meta){
        view.innerHTML = "<p class='empty'>Zákon v manifestu není.</p>";
        return;
      }
      status.textContent = "Načítám " + meta.file + "…";
      let res = await fetch(BASE + meta.file);
      if(!res.ok && meta.file.endsWith(".md")){
        res = await fetch(BASE + meta.file.replace(/\.md$/, ".html"));
      }
      if(!res.ok){
        view.innerHTML = "<p class='empty'>Soubor se nepodařilo načíst.</p>";
        status.textContent = "";
        return;
      }
      let body = await res.text();
      if(/<!DOCTYPE html>/i.test(body)){
        const parsed = new DOMParser().parseFromString(body, "text/html");
        const inner = parsed.querySelector(".markdown-body") || parsed.querySelector("article");
        view.innerHTML = inner ? inner.innerHTML : parsed.body.innerHTML;
      } else {
        body = body.replace(/^---[\s\S]*?---\s*/, "");
        view.innerHTML = marked.parse(body);
      }
      const modeLabel = meta.mode === "full" ? "plný zákon" : "jen dotčené paragrafy";
      const cl = (meta.clanky && meta.clanky.length) ? " · Čl. " + meta.clanky.join(", ") : "";
      status.textContent = modeLabel + cl + (meta.sections != null ? " · " + meta.sections + " § ve výstupu" : "");
      renderNav(document.getElementById("q").value);
    }

    async function boot(){
      const res = await fetch(BASE + "manifest.json");
      const data = await res.json();
      laws = data.laws || [];
      document.getElementById("q").addEventListener("input", e => renderNav(e.target.value));
      window.addEventListener("hashchange", () => openLaw(location.hash.slice(1)));
      renderNav("");
      if(location.hash) openLaw(location.hash.slice(1));
    }
    boot().catch(err => {
      document.getElementById("view").innerHTML =
        "<p class='empty'>Nepodařilo se načíst manifest.json. Otevři stránku přes GitHub Pages (ne file://).</p>";
    });
  </script>
</body>
</html>
